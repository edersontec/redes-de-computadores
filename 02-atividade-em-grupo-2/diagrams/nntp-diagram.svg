<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui, -apple-system, sans-serif; border-radius:12px; border:1px solid #cbd5e1;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect x="0" y="0" width="940" height="46" fill="#1e3a8a" rx="12" />
  <rect x="0" y="30" width="940" height="16" fill="#1e3a8a" />
  <text x="24" y="28" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="0.5">Distribuição Descentralizada e Replicação de Notícias no NNTP (USENET)</text>

  <g transform="translate(0, 46)">
    
    <!-- Usuário A (Autor do Artigo) -->
    <g transform="translate(40, 45)" filter="url(#shadow)">
      <rect width="180" height="145" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
      <rect width="180" height="28" rx="8" fill="#2563eb" />
      <rect y="20" width="180" height="8" fill="#2563eb" />
      <text x="90" y="19" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Cliente USENET A</text>
      <text x="14" y="50" fill="#0f172a" font-size="11">Leitor (ex: Thunderbird)</text>
      <text x="14" y="70" fill="#2563eb" font-size="10" font-weight="700">Comando: POST</text>
      <text x="14" y="88" fill="#475569" font-size="10">Newsgroups: comp.networks</text>
      <text x="14" y="106" fill="#475569" font-size="10">Subject: Dúvida sobre ARP</text>
      <text x="14" y="126" fill="#059669" font-size="10">TCP Porta 119</text>
    </g>

    <!-- Servidor NNTP 1 -->
    <g transform="translate(270, 45)" filter="url(#shadow)">
      <rect width="180" height="145" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <rect width="180" height="28" rx="8" fill="#475569" />
      <rect y="20" width="180" height="8" fill="#475569" />
      <text x="90" y="19" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Servidor NNTP Local</text>
      <text x="14" y="50" fill="#0f172a" font-size="11">news.universidade.edu</text>
      <text x="14" y="72" fill="#059669" font-size="10">Armazena artigo no spool</text>
      <text x="14" y="90" fill="#d97706" font-size="10" font-weight="700">Peering (Inundação):</text>
      <text x="14" y="108" fill="#475569" font-size="10">Comando IHAVE / TAKETHIS</text>
      <text x="14" y="126" fill="#1e3a8a" font-size="10">Replica para vizinhos</text>
    </g>

    <!-- Servidor NNTP 2 -->
    <g transform="translate(500, 45)" filter="url(#shadow)">
      <rect width="180" height="145" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <rect width="180" height="28" rx="8" fill="#475569" />
      <rect y="20" width="180" height="8" fill="#475569" />
      <text x="90" y="19" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Servidor NNTP Remoto</text>
      <text x="14" y="50" fill="#0f172a" font-size="11">news.isp-global.net</text>
      <text x="14" y="72" fill="#059669" font-size="10">Recebe artigo replicado</text>
      <text x="14" y="90" fill="#475569" font-size="10">Indexa Message-ID único</text>
      <text x="14" y="110" fill="#059669" font-size="10" font-weight="700">Disponibiliza aos clientes:</text>
      <text x="14" y="126" fill="#475569" font-size="10">Comandos GROUP e ARTICLE</text>
    </g>

    <!-- Usuário B (Leitor) -->
    <g transform="translate(730, 45)" filter="url(#shadow)">
      <rect width="170" height="145" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2" />
      <rect width="170" height="28" rx="8" fill="#059669" />
      <rect y="20" width="170" height="8" fill="#059669" />
      <text x="85" y="19" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Cliente USENET B</text>
      <text x="14" y="50" fill="#0f172a" font-size="11">Usuário em Tóquio</text>
      <text x="14" y="72" fill="#059669" font-size="10" font-weight="700">Comando: GROUP comp.networks</text>
      <text x="14" y="90" fill="#059669" font-size="10">Comando: ARTICLE 4521</text>
      <text x="14" y="110" fill="#475569" font-size="10">Lê mensagem idêntica</text>
      <text x="14" y="128" fill="#059669" font-size="10">Responde via FOLLOWUP</text>
    </g>

    <!-- Setas de Fluxo -->
    <path d="M 220 95 L 270 95" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)" />
    <path d="M 450 95 L 500 95" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrow-amber)" />
    <path d="M 680 95 L 730 95" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)" />

    <!-- Rodapé -->
    <rect x="40" y="230" width="860" height="75" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="60" y="252" fill="#1e3a8a" font-size="12" font-weight="700">O Legado Histórico da USENET e do NNTP:</text>
    <text x="60" y="272" fill="#334155" font-size="11">1. O NNTP foi o primeiro sistema de fóruns e comunidades em rede global descentralizada da história da computação.</text>
    <text x="60" y="290" fill="#334155" font-size="11">2. Não havia um servidor central: as mensagens propagavam-se organicamente de servidor para servidor via NNTP.</text>

  </g>
</svg>