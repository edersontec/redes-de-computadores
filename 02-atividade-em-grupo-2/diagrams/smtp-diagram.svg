<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui, -apple-system, sans-serif; border-radius:12px; border:1px solid #cbd5e1;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect x="0" y="0" width="940" height="46" fill="#1e3a8a" rx="12" />
  <rect x="0" y="30" width="940" height="16" fill="#1e3a8a" />
  <text x="24" y="28" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="0.5">O Ciclo Completo de Envio e Recepção de E-mails com SMTP</text>

  <g transform="translate(0, 46)">
    
    <!-- Remetente -->
    <g transform="translate(40, 45)" filter="url(#shadow)">
      <rect width="180" height="145" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
      <rect width="180" height="28" rx="8" fill="#2563eb" />
      <rect y="20" width="180" height="8" fill="#2563eb" />
      <text x="90" y="19" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Cliente Mail (MUA)</text>
      <text x="14" y="50" fill="#0f172a" font-size="11">joao@empresa.com</text>
      <text x="14" y="70" fill="#2563eb" font-size="10">Submissão SMTP</text>
      <text x="14" y="86" fill="#2563eb" font-size="10" font-weight="700">Porta TCP 587 (TLS)</text>
      <text x="14" y="108" fill="#475569" font-size="10">Comandos:</text>
      <text x="14" y="124" fill="#475569" font-size="10">EHLO, MAIL FROM, RCPT</text>
    </g>

    <!-- Servidor SMTP Origem -->
    <g transform="translate(280, 45)" filter="url(#shadow)">
      <rect width="180" height="145" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <rect width="180" height="28" rx="8" fill="#475569" />
      <rect y="20" width="180" height="8" fill="#475569" />
      <text x="90" y="19" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Servidor SMTP Origem</text>
      <text x="14" y="50" fill="#0f172a" font-size="11">smtp.empresa.com</text>
      <text x="14" y="72" fill="#d97706" font-size="10" font-weight="700">Consulta DNS (MX):</text>
      <text x="14" y="88" fill="#475569" font-size="10">"Onde está @destino.com?"</text>
      <text x="14" y="108" fill="#059669" font-size="10">Encaminha via Relay</text>
      <text x="14" y="124" fill="#059669" font-size="10" font-weight="700">Porta TCP 25</text>
    </g>

    <!-- Servidor SMTP Destino -->
    <g transform="translate(520, 45)" filter="url(#shadow)">
      <rect width="180" height="145" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2" />
      <rect width="180" height="28" rx="8" fill="#059669" />
      <rect y="20" width="180" height="8" fill="#059669" />
      <text x="90" y="19" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Servidor SMTP Destino</text>
      <text x="14" y="50" fill="#0f172a" font-size="11">mail.destino.com</text>
      <text x="14" y="72" fill="#059669" font-size="10">Escuta Porta 25</text>
      <text x="14" y="90" fill="#475569" font-size="10">Valida SPF/DKIM</text>
      <text x="14" y="108" fill="#0f172a" font-size="10">Armazena na</text>
      <text x="14" y="124" fill="#059669" font-size="10" font-weight="700">Caixa Postal (Mailbox)</text>
    </g>

    <!-- Destinatário Final -->
    <g transform="translate(750, 45)" filter="url(#shadow)">
      <rect width="160" height="145" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2" />
      <rect width="160" height="28" rx="8" fill="#7c3aed" />
      <rect y="20" width="160" height="8" fill="#7c3aed" />
      <text x="80" y="19" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Destinatário</text>
      <text x="12" y="50" fill="#0f172a" font-size="11">maria@destino.com</text>
      <text x="12" y="74" fill="#7c3aed" font-size="10" font-weight="700">Protocolo de Leitura:</text>
      <text x="12" y="92" fill="#475569" font-size="10">IMAP (Porta 993)</text>
      <text x="12" y="108" fill="#475569" font-size="10">ou POP3 (Porta 995)</text>
      <text x="12" y="128" fill="#7c3aed" font-size="10">*(SMTP não lê!)*</text>
    </g>

    <!-- Setas de Fluxo -->
    <path d="M 220 95 L 280 95" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)" />
    <path d="M 460 95 L 520 95" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)" />
    <path d="M 700 95 L 750 95" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="4" marker-end="url(#arrow)" />

    <!-- Rodapé -->
    <rect x="40" y="230" width="870" height="75" rx="8" fill="#eff6ff" stroke="#bfdbfe" />
    <text x="60" y="252" fill="#1e3a8a" font-size="12" font-weight="700">Princípio Arquitetural: Push vs. Pull</text>
    <text x="60" y="272" fill="#334155" font-size="11">• SMTP é um protocolo Push (Empurrar): Usado exclusivamente para enviar e transportar e-mails do cliente para o servidor e entre servidores.</text>
    <text x="60" y="290" fill="#334155" font-size="11">• IMAP e POP3 são protocolos Pull (Puxar): O usuário final precisa de outro protocolo para sincronizar e baixar a mensagem armazenada.</text>

  </g>
</svg>