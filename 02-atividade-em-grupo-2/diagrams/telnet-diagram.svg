<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui, -apple-system, sans-serif; border-radius:12px; border:1px solid #cbd5e1;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect x="0" y="0" width="940" height="46" fill="#1e3a8a" rx="12" />
  <rect x="0" y="30" width="940" height="16" fill="#1e3a8a" />
  <text x="24" y="28" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="0.5">Vulnerabilidade em Texto Claro do Telnet vs. Segurança do SSH</text>

  <g transform="translate(0, 46)">
    
    <!-- Cliente Telnet -->
    <g transform="translate(60, 45)" filter="url(#shadow)">
      <rect width="210" height="165" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
      <rect width="210" height="30" rx="8" fill="#2563eb" />
      <rect y="22" width="210" height="8" fill="#2563eb" />
      <text x="105" y="20" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Cliente Telnet (Terminal)</text>
      <text x="14" y="52" fill="#0f172a" font-size="11" font-weight="600">Comando: telnet 10.0.0.1 23</text>
      <text x="14" y="72" fill="#475569" font-size="11">Usuário digita:</text>
      <text x="14" y="90" fill="#1e3a8a" font-size="11">login: admin</text>
      <text x="14" y="108" fill="#1e3a8a" font-size="11">password: Cisco#2026</text>
      <line x1="14" y1="122" x2="196" y2="122" stroke="#e2e8f0" stroke-width="1" />
      <text x="14" y="142" fill="#dc2626" font-size="10" font-weight="700">Sem criptografia!</text>
    </g>

    <!-- Sniffer Invasor no Meio -->
    <g transform="translate(365, 45)" filter="url(#shadow)">
      <rect width="210" height="165" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="4" />
      <rect width="210" height="30" rx="8" fill="#dc2626" />
      <rect y="22" width="210" height="8" fill="#dc2626" />
      <text x="105" y="20" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Sniffer / Interceptador</text>
      <text x="14" y="52" fill="#991b1b" font-size="11" font-weight="700">Ataque Eavesdropping (Wireshark)</text>
      <text x="14" y="72" fill="#7f1d1d" font-size="10">Captura em texto puro:</text>
      <rect x="14" y="82" width="182" height="40" rx="4" fill="#ffffff" stroke="#fca5a5" />
      <text x="24" y="98" fill="#dc2626" font-size="10" font-family="monospace">USER: admin</text>
      <text x="24" y="114" fill="#dc2626" font-size="10" font-family="monospace">PASS: Cisco#2026</text>
      <text x="14" y="145" fill="#991b1b" font-size="10" font-weight="600">Credenciais vazadas!</text>
    </g>

    <!-- Servidor Remoto -->
    <g transform="translate(670, 45)" filter="url(#shadow)">
      <rect width="210" height="165" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <rect width="210" height="30" rx="8" fill="#475569" />
      <rect y="22" width="210" height="8" fill="#475569" />
      <text x="105" y="20" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Roteador / Servidor Unix</text>
      <text x="14" y="52" fill="#0f172a" font-size="11">Escuta na Porta TCP 23</text>
      <text x="14" y="72" fill="#475569" font-size="11">Abre pseudoterminal (pty)</text>
      <text x="14" y="90" fill="#059669" font-size="11">Executa comandos shell</text>
      <text x="14" y="108" fill="#475569" font-size="11">Retorna saída do terminal</text>
      <line x1="14" y1="122" x2="196" y2="122" stroke="#e2e8f0" stroke-width="1" />
      <text x="14" y="142" fill="#475569" font-size="10">show running-config</text>
    </g>

    <!-- Linha de Conexão -->
    <path d="M 270 115 L 365 115" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)" />
    <path d="M 575 115 L 670 115" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)" />

    <!-- Rodapé -->
    <rect x="40" y="235" width="850" height="75" rx="8" fill="#f0fdf4" stroke="#bbf7d0" />
    <text x="60" y="258" fill="#166534" font-size="12" font-weight="700">A Solução Definitiva: Migração Obrigatória para SSH (Porta TCP 22)</text>
    <text x="60" y="278" fill="#14532d" font-size="11">1. O SSH substituiu o Telnet em todas as redes modernas criando um túnel criptografado assimétrico (RSA/Ed25519) + simétrico (AES-256).</text>
    <text x="60" y="296" fill="#14532d" font-size="11">2. Mesmo com sniffers na rede pública, é matematicamente impossível decifrar senhas ou comandos trafegados via SSH.</text>

  </g>
</svg>