<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui, -apple-system, sans-serif; border-radius:12px; border:1px solid #cbd5e1;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect x="0" y="0" width="940" height="46" fill="#1e3a8a" rx="12" />
  <rect x="0" y="30" width="940" height="16" fill="#1e3a8a" />
  <text x="24" y="28" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="0.5">O Modelo Best-Effort e Baixa Latência do UDP (User Datagram Protocol)</text>

  <g transform="translate(0, 46)">
    
    <!-- Transmissor UDP -->
    <g transform="translate(60, 45)" filter="url(#shadow)">
      <rect width="210" height="160" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2" />
      <rect width="210" height="30" rx="8" fill="#d97706" />
      <rect y="22" width="210" height="8" fill="#d97706" />
      <text x="105" y="20" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Transmissor (Servidor Jogo / Stream)</text>
      <text x="14" y="52" fill="#0f172a" font-size="11" font-weight="600">Disparo Contínuo:</text>
      <text x="14" y="70" fill="#d97706" font-size="11">• Sem Handshake prévio</text>
      <text x="14" y="88" fill="#d97706" font-size="11">• Sem espera de ACKs</text>
      <text x="14" y="108" fill="#475569" font-size="11">• Cabeçalho fixo de 8 bytes</text>
      <text x="14" y="130" fill="#059669" font-size="11" font-weight="700">Prioridade: Tempo Real</text>
    </g>

    <!-- Tráfego de Datagramas -->
    <!-- Pacote 1 (Sucesso) -->
    <g transform="translate(320, 35)">
      <rect width="180" height="32" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" />
      <text x="90" y="20" fill="#065f46" font-size="11" font-weight="700" text-anchor="middle">Datagrama 1: Posição X (0 ms)</text>
      <path d="M 180 16 L 340 16" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)" />
    </g>

    <!-- Pacote 2 (Perdido) -->
    <g transform="translate(320, 95)">
      <rect width="180" height="32" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4" />
      <text x="90" y="20" fill="#991b1b" font-size="11" font-weight="700" text-anchor="middle">Datagrama 2: Posição Y (Loss!)</text>
      <line x1="190" y1="16" x2="250" y2="16" stroke="#dc2626" stroke-width="2" />
      <text x="270" y="20" fill="#dc2626" font-size="13" font-weight="800">✗ Descartado</text>
    </g>

    <!-- Pacote 3 (Sucesso) -->
    <g transform="translate(320, 155)">
      <rect width="180" height="32" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" />
      <text x="90" y="20" fill="#065f46" font-size="11" font-weight="700" text-anchor="middle">Datagrama 3: Posição Z (20 ms)</text>
      <path d="M 180 16 L 340 16" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)" />
    </g>

    <!-- Receptor UDP -->
    <g transform="translate(680, 45)" filter="url(#shadow)">
      <rect width="200" height="160" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
      <rect width="200" height="30" rx="8" fill="#2563eb" />
      <rect y="22" width="200" height="8" fill="#2563eb" />
      <text x="100" y="20" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Receptor (Jogador / Ouvinte)</text>
      <text x="14" y="52" fill="#059669" font-size="11">✓ Recebe Pacote 1 (renderiza)</text>
      <text x="14" y="74" fill="#dc2626" font-size="11">✗ Pacote 2 perdido (ignora!)</text>
      <text x="14" y="96" fill="#059669" font-size="11">✓ Recebe Pacote 3 (renderiza)</text>
      <line x1="14" y1="112" x2="186" y2="112" stroke="#e2e8f0" stroke-width="1" />
      <text x="14" y="130" fill="#1e3a8a" font-size="10" font-weight="700">Sem congelamento de buffer!</text>
      <text x="14" y="146" fill="#64748b" font-size="10">Experiência contínua ao vivo</text>
    </g>

    <!-- Rodapé -->
    <rect x="40" y="235" width="850" height="75" rx="8" fill="#fffbeb" stroke="#fde68a" />
    <text x="60" y="258" fill="#92400e" font-size="12" font-weight="700">Por que o UDP é insubstituível em tempo real?</text>
    <text x="60" y="278" fill="#78350f" font-size="11">1. Se o pacote 2 fosse TCP, a transmissão travaria esperando retransmissão, causando atraso acumulado.</text>
    <text x="60" y="296" fill="#78350f" font-size="11">2. No UDP, a perda de um único frame de áudio ou vídeo é imperceptível ao olho ou ouvido humano, mantendo latência mínima.</text>

  </g>
</svg>