<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui, -apple-system, sans-serif; border-radius:12px; border:1px solid #cbd5e1;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect x="0" y="0" width="940" height="46" fill="#1e3a8a" rx="12" />
  <rect x="0" y="30" width="940" height="16" fill="#1e3a8a" />
  <text x="24" y="28" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="0.5">Arquitetura de Duas Conexões do FTP (File Transfer Protocol)</text>

  <g transform="translate(0, 46)">
    
    <!-- Cliente FTP -->
    <g transform="translate(50, 45)" filter="url(#shadow)">
      <rect width="200" height="165" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
      <rect width="200" height="32" rx="8" fill="#2563eb" />
      <rect y="24" width="200" height="8" fill="#2563eb" />
      <text x="100" y="22" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Cliente FTP (FileZilla)</text>
      <text x="14" y="58" fill="#0f172a" font-size="11">Porta de Controle local: 50123</text>
      <text x="14" y="78" fill="#0f172a" font-size="11">Porta de Dados local: 50124</text>
      <line x1="14" y1="92" x2="186" y2="92" stroke="#e2e8f0" stroke-width="1" />
      <text x="14" y="112" fill="#2563eb" font-size="11" font-weight="600">Comandos:</text>
      <text x="14" y="129" fill="#475569" font-size="11">USER, PASS, LIST</text>
      <text x="14" y="147" fill="#475569" font-size="11">RETR (Download), STOR (Upload)</text>
    </g>

    <!-- Servidor FTP -->
    <g transform="translate(680, 45)" filter="url(#shadow)">
      <rect width="210" height="165" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2" />
      <rect width="210" height="32" rx="8" fill="#059669" />
      <rect y="24" width="210" height="8" fill="#059669" />
      <text x="105" y="22" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Servidor FTP (vsftpd)</text>
      <text x="14" y="58" fill="#0f172a" font-size="11" font-weight="700">Porta 21: Controle de Comandos</text>
      <text x="14" y="78" fill="#0f172a" font-size="11" font-weight="700">Porta 20: Fluxo de Dados (Ativo)</text>
      <line x1="14" y1="92" x2="196" y2="92" stroke="#e2e8f0" stroke-width="1" />
      <text x="14" y="112" fill="#059669" font-size="11" font-weight="600">Respostas de Status:</text>
      <text x="14" y="129" fill="#475569" font-size="11">220 Ready | 331 User OK</text>
      <text x="14" y="147" fill="#475569" font-size="11">230 Logged in | 226 Transfer OK</text>
    </g>

    <!-- Conexão 1: Canal de Controle -->
    <path d="M 250 85 L 680 85" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)" />
    <rect x="330" y="55" width="270" height="40" rx="6" fill="#eff6ff" stroke="#bfdbfe" />
    <text x="465" y="72" fill="#1e40af" font-size="11" font-weight="700" text-anchor="middle">Canal de Controle (TCP Porta 21)</text>
    <text x="465" y="87" fill="#3b82f6" font-size="10" text-anchor="middle">Autenticação, navegação de pastas e comandos</text>

    <!-- Conexão 2: Canal de Dados -->
    <path d="M 680 155 L 250 155" fill="none" stroke="#059669" stroke-width="3" stroke-dasharray="6" marker-end="url(#arrow-green)" />
    <rect x="330" y="135" width="270" height="40" rx="6" fill="#ecfdf5" stroke="#a7f3d0" />
    <text x="465" y="152" fill="#065f46" font-size="11" font-weight="700" text-anchor="middle">Canal de Dados (TCP Porta 20 ou PASV)</text>
    <text x="465" y="167" fill="#047857" font-size="10" text-anchor="middle">Transferência pura de arquivos binários (ex: backup.zip)</text>

    <!-- Rodapé -->
    <rect x="40" y="240" width="850" height="70" rx="8" fill="#fffbeb" stroke="#fde68a" />
    <text x="60" y="262" fill="#92400e" font-size="12" font-weight="700">Separação de Canais do FTP:</text>
    <text x="60" y="282" fill="#78350f" font-size="11">1. O canal de controle (porta 21) permanece ativo durante toda a sessão para troca de instruções.</text>
    <text x="60" y="298" fill="#78350f" font-size="11">2. O canal de dados (porta 20 ou porta dinâmica PASV) é aberto sob demanda para cada arquivo e fechado logo após.</text>

  </g>
</svg>