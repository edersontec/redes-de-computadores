<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui, -apple-system, sans-serif; border-radius:12px; border:1px solid #cbd5e1;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect x="0" y="0" width="940" height="46" fill="#1e3a8a" rx="12" />
  <rect x="0" y="30" width="940" height="16" fill="#1e3a8a" />
  <text x="24" y="28" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="0.5">Fluxo Operacional do Protocolo ARP (Address Resolution Protocol)</text>

  <g transform="translate(0, 46)">
    
    <!-- Host A -->
    <g transform="translate(40, 45)" filter="url(#shadow)">
      <rect width="180" height="140" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
      <rect width="180" height="32" rx="8" fill="#2563eb" />
      <rect y="24" width="180" height="8" fill="#2563eb" />
      <text x="90" y="21" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Host A (Origem)</text>
      <text x="14" y="58" fill="#0f172a" font-size="11" font-weight="600">IP: 192.168.1.10</text>
      <text x="14" y="76" fill="#64748b" font-size="11">MAC: 00:1A:2B:3C:01</text>
      <line x1="14" y1="88" x2="166" y2="88" stroke="#e2e8f0" stroke-width="1" />
      <text x="14" y="106" fill="#1e40af" font-size="11" font-weight="600">Tabela ARP Cache:</text>
      <text x="14" y="124" fill="#059669" font-size="11">192.168.1.20 → MAC ?</text>
    </g>

    <!-- Switch Central -->
    <g transform="translate(370, 65)" filter="url(#shadow)">
      <rect width="180" height="100" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <rect width="180" height="28" rx="8" fill="#334155" />
      <rect y="20" width="180" height="8" fill="#334155" />
      <text x="90" y="19" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Switch LAN (L2)</text>
      <text x="90" y="55" fill="#0f172a" font-size="11" text-anchor="middle">Inundação Broadcast</text>
      <text x="90" y="75" fill="#64748b" font-size="11" text-anchor="middle">Propaga por todas portas</text>
    </g>

    <!-- Host B (Destino) -->
    <g transform="translate(700, 30)" filter="url(#shadow)">
      <rect width="190" height="105" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2" />
      <rect width="190" height="28" rx="8" fill="#059669" />
      <rect y="20" width="190" height="8" fill="#059669" />
      <text x="95" y="19" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Host B (Destino)</text>
      <text x="14" y="52" fill="#0f172a" font-size="11" font-weight="600">IP: 192.168.1.20</text>
      <text x="14" y="70" fill="#64748b" font-size="11">MAC: AA:BB:CC:DD:02</text>
      <text x="14" y="90" fill="#059669" font-size="11" font-weight="600">✓ Responde ARP Reply!</text>
    </g>

    <!-- Host C (Outro) -->
    <g transform="translate(700, 150)" filter="url(#shadow)">
      <rect width="190" height="85" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
      <rect width="190" height="26" rx="8" fill="#64748b" />
      <rect y="18" width="190" height="8" fill="#64748b" />
      <text x="95" y="18" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Host C (Outro Nó)</text>
      <text x="14" y="48" fill="#0f172a" font-size="11">IP: 192.168.1.30</text>
      <text x="14" y="68" fill="#dc2626" font-size="11">✗ Descarta pacote (não é o IP)</text>
    </g>

    <!-- Setas de Fluxo -->
    <path d="M 220 85 L 370 95" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)" />
    <text x="295" y="75" fill="#1e40af" font-size="11" font-weight="700" text-anchor="middle">1. ARP Request</text>

    <path d="M 550 95 L 700 65" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)" />
    <path d="M 550 115 L 700 175" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)" />

    <path d="M 700 90 L 220 145" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)" />
    <rect x="360" y="185" width="240" height="34" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
    <text x="480" y="200" fill="#065f46" font-size="11" font-weight="700" text-anchor="middle">2. ARP Reply (Unicast direto)</text>
    <text x="480" y="213" fill="#047857" font-size="10" text-anchor="middle">"192.168.1.20 sou eu! MAC: AA:BB:CC:DD:02"</text>

    <!-- Resumo Inferior -->
    <rect x="40" y="250" width="850" height="60" rx="8" fill="#eff6ff" stroke="#bfdbfe" />
    <text x="60" y="272" fill="#1e3a8a" font-size="12" font-weight="700">Resultado Operacional:</text>
    <text x="60" y="294" fill="#334155" font-size="11">O Host A armazena o MAC na ARP Cache e agora pode encapsular datagramas IP em quadros Ethernet físicos.</text>

  </g>
</svg>