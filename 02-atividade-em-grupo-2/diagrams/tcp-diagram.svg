<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui, -apple-system, sans-serif; border-radius:12px; border:1px solid #cbd5e1;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect x="0" y="0" width="940" height="46" fill="#1e3a8a" rx="12" />
  <rect x="0" y="30" width="940" height="16" fill="#1e3a8a" />
  <text x="24" y="28" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="0.5">O Aperto de Mão em Três Vias (Three-Way Handshake) do TCP</text>

  <g transform="translate(0, 46)">
    
    <line x1="220" y1="30" x2="220" y2="260" stroke="#2563eb" stroke-width="3" />
    <line x1="720" y1="30" x2="720" y2="260" stroke="#059669" stroke-width="3" />

    <rect x="150" y="10" width="140" height="30" rx="6" fill="#2563eb" />
    <text x="220" y="30" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Cliente TCP</text>

    <rect x="650" y="10" width="140" height="30" rx="6" fill="#059669" />
    <text x="720" y="30" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Servidor TCP</text>

    <!-- 1. SYN -->
    <line x1="220" y1="65" x2="720" y2="95" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)" />
    <rect x="390" y="60" width="180" height="22" rx="4" fill="#eff6ff" stroke="#bfdbfe" />
    <text x="480" y="75" fill="#1e40af" font-size="11" font-weight="700" text-anchor="middle">1. SYN (seq = 100)</text>

    <!-- 2. SYN-ACK -->
    <line x1="720" y1="105" x2="220" y2="135" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)" />
    <rect x="370" y="102" width="220" height="22" rx="4" fill="#ecfdf5" stroke="#a7f3d0" />
    <text x="480" y="117" fill="#065f46" font-size="11" font-weight="700" text-anchor="middle">2. SYN-ACK (seq = 300, ack = 101)</text>

    <!-- 3. ACK -->
    <line x1="220" y1="145" x2="720" y2="175" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)" />
    <rect x="390" y="142" width="180" height="22" rx="4" fill="#eff6ff" stroke="#bfdbfe" />
    <text x="480" y="157" fill="#1e40af" font-size="11" font-weight="700" text-anchor="middle">3. ACK (seq = 101, ack = 301)</text>

    <text x="480" y="190" fill="#059669" font-size="11" font-weight="800" text-anchor="middle">ESTABLISHED (Conexão Confiável Aberta)</text>

    <!-- Dados e Confirmação -->
    <line x1="220" y1="210" x2="720" y2="235" stroke="#2563eb" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)" />
    <text x="360" y="218" fill="#1e3a8a" font-size="10">DADOS [Bytes 101..500]</text>

    <line x1="720" y1="240" x2="220" y2="260" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)" />
    <text x="540" y="258" fill="#065f46" font-size="10">ACK 501 (Confirmado)</text>

    <!-- Caixas Laterais -->
    <g transform="translate(20, 85)">
      <rect width="120" height="80" rx="6" fill="#ffffff" stroke="#cbd5e1" />
      <text x="60" y="22" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">Garantias TCP:</text>
      <text x="60" y="42" fill="#059669" font-size="10" text-anchor="middle">✓ Sem perdas</text>
      <text x="60" y="58" fill="#059669" font-size="10" text-anchor="middle">✓ Ordem correta</text>
      <text x="60" y="74" fill="#059669" font-size="10" text-anchor="middle">✓ Controle de fluxo</text>
    </g>

    <g transform="translate(800, 85)">
      <rect width="120" height="80" rx="6" fill="#ffffff" stroke="#cbd5e1" />
      <text x="60" y="22" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">Flags do Cabeçalho:</text>
      <text x="60" y="42" fill="#2563eb" font-size="10" text-anchor="middle">SYN, ACK, PSH</text>
      <text x="60" y="58" fill="#2563eb" font-size="10" text-anchor="middle">FIN, RST, URG</text>
      <text x="60" y="74" fill="#64748b" font-size="10" text-anchor="middle">Tamanho: 20 bytes</text>
    </g>

    <!-- Rodapé -->
    <rect x="40" y="285" width="850" height="35" rx="6" fill="#f1f5f9" stroke="#cbd5e1" />
    <text x="465" y="307" fill="#334155" font-size="11" text-anchor="middle">O Three-Way Handshake sincroniza os números de sequência iniciais e garante que ambos os lados estão prontos.</text>

  </g>
</svg>