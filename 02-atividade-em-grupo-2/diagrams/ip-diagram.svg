<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui, -apple-system, sans-serif; border-radius:12px; border:1px solid #cbd5e1;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect x="0" y="0" width="940" height="46" fill="#1e3a8a" rx="12" />
  <rect x="0" y="30" width="940" height="16" fill="#1e3a8a" />
  <text x="24" y="28" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="0.5">Encapsulamento e Roteamento Hop-by-Hop do IP (Internet Protocol)</text>

  <g transform="translate(0, 46)">
    
    <!-- Host Origem LAN 1 -->
    <g transform="translate(40, 45)" filter="url(#shadow)">
      <rect width="170" height="125" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
      <rect width="170" height="28" rx="8" fill="#2563eb" />
      <rect y="20" width="170" height="8" fill="#2563eb" />
      <text x="85" y="19" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Host A (LAN Salvador)</text>
      <text x="12" y="52" fill="#0f172a" font-size="11" font-weight="600">IP: 192.168.1.15</text>
      <text x="12" y="70" fill="#64748b" font-size="10">Máscara: /24</text>
      <text x="12" y="88" fill="#2563eb" font-size="10">Destino: 200.18.90.5</text>
      <text x="12" y="108" fill="#475569" font-size="10">→ Envia ao Gateway</text>
    </g>

    <!-- Roteador R1 -->
    <g transform="translate(260, 55)" filter="url(#shadow)">
      <circle cx="50" cy="50" r="45" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <text x="50" y="44" fill="#1e3a8a" font-size="13" font-weight="800" text-anchor="middle">R1</text>
      <text x="50" y="60" fill="#64748b" font-size="10" text-anchor="middle">Gateway</text>
      <text x="50" y="115" fill="#475569" font-size="10" text-anchor="middle">TTL: 64 → 63</text>
    </g>

    <!-- Backbone Nuvem R2/R3 -->
    <g transform="translate(420, 40)">
      <ellipse cx="80" cy="65" rx="75" ry="45" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4" />
      <text x="80" y="55" fill="#1e293b" font-size="12" font-weight="700" text-anchor="middle">Backbone IP</text>
      <text x="80" y="72" fill="#64748b" font-size="10" text-anchor="middle">Roteamento BGP/OSPF</text>
      <text x="80" y="88" fill="#475569" font-size="10" text-anchor="middle">TTL: 63 → 62</text>
    </g>

    <!-- Roteador R2 Destino -->
    <g transform="translate(610, 55)" filter="url(#shadow)">
      <circle cx="50" cy="50" r="45" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <text x="50" y="44" fill="#059669" font-size="13" font-weight="800" text-anchor="middle">R2</text>
      <text x="50" y="60" fill="#64748b" font-size="10" text-anchor="middle">Borda Destino</text>
      <text x="50" y="115" fill="#475569" font-size="10" text-anchor="middle">TTL: 62 → 61</text>
    </g>

    <!-- Host B Destino -->
    <g transform="translate(740, 45)" filter="url(#shadow)">
      <rect width="170" height="125" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2" />
      <rect width="170" height="28" rx="8" fill="#059669" />
      <rect y="20" width="170" height="8" fill="#059669" />
      <text x="85" y="19" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">Host B (Servidor SP)</text>
      <text x="12" y="52" fill="#0f172a" font-size="11" font-weight="600">IP: 200.18.90.5</text>
      <text x="12" y="70" fill="#64748b" font-size="10">Porta: 443</text>
      <text x="12" y="88" fill="#059669" font-size="10" font-weight="600">✓ Datagrama Entregue</text>
      <text x="12" y="108" fill="#475569" font-size="10">Passa para Camada 4</text>
    </g>

    <!-- Conexões de Rota -->
    <path d="M 210 105 L 260 105" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)" />
    <path d="M 360 105 L 420 105" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
    <path d="M 575 105 L 610 105" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
    <path d="M 710 105 L 740 105" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)" />

    <!-- Estrutura do Pacote IP -->
    <g transform="translate(140, 190)">
      <rect width="660" height="38" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
      <text x="75" y="24" fill="#1e40af" font-size="11" font-weight="700" text-anchor="middle">IP Origem (32b)</text>
      <line x1="150" y1="0" x2="150" y2="38" stroke="#bfdbfe" stroke-width="1.5" />
      <text x="235" y="24" fill="#1e40af" font-size="11" font-weight="700" text-anchor="middle">IP Destino (32b)</text>
      <line x1="320" y1="0" x2="320" y2="38" stroke="#bfdbfe" stroke-width="1.5" />
      <text x="375" y="24" fill="#1e40af" font-size="11" font-weight="700" text-anchor="middle">TTL (8b)</text>
      <line x1="430" y1="0" x2="430" y2="38" stroke="#bfdbfe" stroke-width="1.5" />
      <text x="495" y="24" fill="#1e40af" font-size="11" font-weight="700" text-anchor="middle">Protocolo (TCP=6)</text>
      <line x1="560" y1="0" x2="560" y2="38" stroke="#bfdbfe" stroke-width="1.5" />
      <text x="610" y="24" fill="#059669" font-size="11" font-weight="700" text-anchor="middle">Payload</text>
    </g>

    <!-- Rodapé -->
    <rect x="40" y="245" width="850" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="60" y="268" fill="#1e3a8a" font-size="12" font-weight="700">Roteamento Hop-by-Hop e Função do TTL:</text>
    <text x="60" y="288" fill="#334155" font-size="11">Cada roteador no caminho consulta sua tabela de rotas e decrementa o Time To Live (TTL) em 1 para evitar loops infinitos na rede.</text>

  </g>
</svg>