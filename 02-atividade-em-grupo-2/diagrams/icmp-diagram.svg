<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="100%" height="100%" style="background:#f8fafc; font-family:system-ui, -apple-system, sans-serif; border-radius:12px; border:1px solid #cbd5e1;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect x="0" y="0" width="940" height="46" fill="#1e3a8a" rx="12" />
  <rect x="0" y="30" width="940" height="16" fill="#1e3a8a" />
  <text x="24" y="28" fill="#ffffff" font-size="16" font-weight="700" letter-spacing="0.5">Mecanismo de Diagnóstico e Controle do ICMP (Ping & Traceroute)</text>

  <g transform="translate(0, 46)">
    
    <!-- Host Origem -->
    <g transform="translate(40, 45)" filter="url(#shadow)">
      <rect width="180" height="150" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
      <rect width="180" height="28" rx="8" fill="#2563eb" />
      <rect y="20" width="180" height="8" fill="#2563eb" />
      <text x="90" y="19" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Host Origem (Seu PC)</text>
      <text x="14" y="52" fill="#0f172a" font-size="11" font-weight="600">IP: 192.168.0.100</text>
      <text x="14" y="74" fill="#2563eb" font-size="11">Executa: ping 8.8.8.8</text>
      <text x="14" y="96" fill="#475569" font-size="10">1. Dispara Echo Request</text>
      <text x="14" y="114" fill="#475569" font-size="10">2. Marca timestamp de envio</text>
      <text x="14" y="134" fill="#059669" font-size="10" font-weight="600">Calcula RTT: 15 ms</text>
    </g>

    <!-- Roteador Intermediário -->
    <g transform="translate(380, 45)" filter="url(#shadow)">
      <rect width="180" height="150" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <rect width="180" height="28" rx="8" fill="#475569" />
      <rect y="20" width="180" height="8" fill="#475569" />
      <text x="90" y="19" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Roteador Gateway</text>
      <text x="14" y="52" fill="#0f172a" font-size="11" font-weight="600">IP: 192.168.0.1</text>
      <text x="14" y="74" fill="#64748b" font-size="11">Roteia pacotes IP</text>
      <text x="14" y="96" fill="#dc2626" font-size="10">Se TTL = 0:</text>
      <text x="14" y="112" fill="#dc2626" font-size="10">Envia ICMP Time Exceeded</text>
      <text x="14" y="134" fill="#475569" font-size="10">(Base do traceroute)</text>
    </g>

    <!-- Destino -->
    <g transform="translate(710, 45)" filter="url(#shadow)">
      <rect width="180" height="150" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2" />
      <rect width="180" height="28" rx="8" fill="#059669" />
      <rect y="20" width="180" height="8" fill="#059669" />
      <text x="90" y="19" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Servidor Destino</text>
      <text x="14" y="52" fill="#0f172a" font-size="11" font-weight="600">IP: 8.8.8.8 (Google DNS)</text>
      <text x="14" y="74" fill="#059669" font-size="11">Recebe Echo Request</text>
      <text x="14" y="96" fill="#475569" font-size="10">Inverte endereços</text>
      <text x="14" y="114" fill="#059669" font-size="10">Dispara Echo Reply</text>
      <text x="14" y="134" fill="#059669" font-size="10" font-weight="600">Type: 0 | Code: 0</text>
    </g>

    <!-- Echo Request -->
    <path d="M 220 80 L 710 80" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)" />
    <rect x="330" y="15" width="280" height="28" rx="4" fill="#eff6ff" stroke="#bfdbfe" />
    <text x="470" y="33" fill="#1e40af" font-size="11" font-weight="700" text-anchor="middle">ICMP Echo Request (Type 8, Code 0)</text>

    <!-- Echo Reply -->
    <path d="M 710 145 L 220 145" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)" />
    <rect x="330" y="160" width="280" height="28" rx="4" fill="#ecfdf5" stroke="#a7f3d0" />
    <text x="470" y="178" fill="#065f46" font-size="11" font-weight="700" text-anchor="middle">ICMP Echo Reply (Type 0, Code 0)</text>

    <!-- Rodapé -->
    <rect x="40" y="235" width="850" height="75" rx="8" fill="#f8fafc" stroke="#cbd5e1" />
    <text x="60" y="258" fill="#1e3a8a" font-size="12" font-weight="700">Mensagens Típicas de Diagnóstico ICMP:</text>
    <text x="60" y="278" fill="#334155" font-size="11">• Type 8 / Type 0: Echo Request e Reply (utilizados pelo comando ping para testar conectividade e latência).</text>
    <text x="60" y="296" fill="#334155" font-size="11">• Type 3: Destination Unreachable (porta/host inalcançável) | Type 11: Time Exceeded (TTL esgotado no salto).</text>

  </g>
</svg>